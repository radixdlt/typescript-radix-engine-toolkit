name: Release

on:
  workflow_dispatch: {}

  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: RDXWorks-actions/checkout@main
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: RDXWorks-actions/setup-node@main
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          always-auth: true
      
      - name: Upgrade npm
        run: npm i -g npm@^11.5.1

      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn run build
      - name: Release
        run: env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG yarn publish --verbose
